<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher-β0.1</title>
</head>
<body>

<!-- 工具视图（全屏 iframe） -->
<div id="view-tool" style="position:fixed;inset:0;display:none;">
    <iframe id="toolFrame" style="width:100%;height:100%;border:none;display:block;background:#fff;"></iframe>
</div>

<!-- 启动器主界面 -->
<div id="view-list" style="display:none;padding:24px;font-family:system-ui,sans-serif;">
    <h1 id="launcherTitle"></h1>

    <fieldset style="margin:16px 0;">
        <legend>已下载版本</legend>
        <div id="localVersionList"></div>
    </fieldset>

    <div style="margin-top:16px;">
        <button id="openBtn" disabled>打开该版本</button>
        <button id="checkBtn" style="margin-left:8px;">检查更新</button>
    </div>

    <fieldset id="remoteSection" style="margin:16px 0;display:none;">
        <legend>可用版本</legend>
        <div id="remoteVersionList"></div>
        <div style="margin-top:12px;">
            <button id="downloadBtn" disabled>下载该版本</button>
        </div>
        <pre id="changelogDisplay" style="margin-top:12px;padding:12px;background:#f5f5f5;white-space:pre-wrap;min-height:60px;border:1px solid #ddd;font-family:monospace;font-size:12px;"></pre>
    </fieldset>

    <fieldset style="margin:16px 0;">
        <legend>选择源</legend>
        <label><input type="radio" name="source" value="gitee"> Gitee</label>
        <label style="margin-left:16px;"><input type="radio" name="source" value="github"> GitHub</label>
    </fieldset>
</div>

<script>
/* ============================================================
 * 配置
 * ============================================================ */
const OWNER = 'seasinvo';
const REPO = 'YuYiTool';
const REF = 'main';
const TIMEOUT_MS = 10000;

const PREFIX = {
    gitee: `https://gitee.com/api/v5/repos/${OWNER}/${REPO}/contents/`,
    github: `https://raw.githubusercontent.com/${OWNER}/${REPO}/${REF}/`
};

const DB_NAME = 'YuYiTool_Launcher';
const DB_VER = 1;
const STORE_FILES = 'files';
const STORE_META = 'meta';
const INFO_KEY = 'info.json';

/* ============================================================
 * IndexedDB（操作后关闭连接）
 * ============================================================ */
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_FILES)) db.createObjectStore(STORE_FILES);
            if (!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function idbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        tx.oncomplete = () => db.close();
    });
}

async function idbSet(store, key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value, key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error); };
    });
}

async function idbKeys(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAllKeys();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        tx.oncomplete = () => db.close();
    });
}

/* ============================================================
 * info.json
 * ============================================================ */
async function getInfo() {
    let info = await idbGet(STORE_META, INFO_KEY);
    if (!info) {
        info = { lastCheckTime: 0, source: 'gitee' };
        await idbSet(STORE_META, INFO_KEY, info);
    }
    if (!info.source) info.source = 'gitee';
    if (!info.lastCheckTime) info.lastCheckTime = 0;
    return info;
}

async function saveInfo(info) {
    await idbSet(STORE_META, INFO_KEY, info);
}

/* ============================================================
 * 工具函数
 * ============================================================ */
function encodePath(p) {
    return p.split('/').map(encodeURIComponent).join('/');
}

function base64DecodeUnicode(b64) {
    const binary = atob(b64.replace(/\n/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
}

function parseVersion(v) {
    const prefix = v[0];
    const nums = v.slice(1).split('.').map(n => parseInt(n, 10) || 0);
    while (nums.length < 3) nums.push(0);
    return { prefix, nums };
}

function compareVersion(a, b) {
    const va = parseVersion(a);
    const vb = parseVersion(b);
    for (let i = 0; i < 3; i++) {
        if (va.nums[i] !== vb.nums[i]) return va.nums[i] - vb.nums[i];
    }
    if (va.prefix !== vb.prefix) return va.prefix === 'V' ? 1 : -1;
    return 0;
}

function versionSubDir(v) {
    return v[0] === 'V' ? 'release' : 'beta';
}

function toolboxPath(v) {
    return `工具箱/版本/${versionSubDir(v)}/YuYiTool-${v}.html`;
}

function launcherPath(v) {
    return `工具箱/启动器/版本/${versionSubDir(v)}/Launcher-${v}.html`;
}

function getLastSundayMidnight(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - d.getDay());
    return d.getTime();
}

/* ============================================================
 * 带数据静默超时的 fetch
 * ============================================================ */
async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    let timer = null;
    let timedOut = false;

    const resetTimer = () => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { timedOut = true; controller.abort(); }, timeoutMs);
    };
    resetTimer();

    try {
        const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        resetTimer();

        let buffer = new Uint8Array(0);
        if (res.body) {
            const reader = res.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                resetTimer();
            }
            let total = 0;
            for (const c of chunks) total += c.length;
            buffer = new Uint8Array(total);
            let off = 0;
            for (const c of chunks) { buffer.set(c, off); off += c.length; }
        }
        if (timer) clearTimeout(timer);
        return { status: res.status, ok: res.ok, buffer };
    } catch (e) {
        if (timer) clearTimeout(timer);
        if (timedOut) {
            const err = new Error('TIMEOUT');
            err.code = 'TIMEOUT';
            throw err;
        }
        throw e;
    }
}

/* ============================================================
 * 统一拉取文件（Gitee API / GitHub raw）
 * ============================================================ */
async function fetchFile(path) {
    const info = await getInfo();
    const source = info.source;
    const url = source === 'gitee'
        ? PREFIX.gitee + encodePath(path) + '?ref=' + REF
        : PREFIX.github + encodePath(path);

    let result;
    try {
        result = await fetchWithTimeout(url, TIMEOUT_MS);
    } catch (e) {
        if (source === 'github') {
            throw new Error('网络连接失败，尝试使用加速器链接或使用gitee');
        } else {
            throw new Error(e.message || String(e));
        }
    }

    const text = new TextDecoder('utf-8').decode(result.buffer);

    if (!result.ok) {
        if (source === 'gitee') {
            if (result.status === 403) {
                throw new Error('服务器限流，请一个小时后再试，或切换github进行下载');
            } else if (result.status === 404) {
                throw new Error('未找到文件，请联系开发者手动更新gitee仓库');
            } else {
                const snippet = text.length > 200 ? text.slice(0, 200) + '...' : text;
                throw new Error(`HTTP ${result.status}：${snippet}`);
            }
        } else {
            const snippet = text.length > 200 ? text.slice(0, 200) + '...' : text;
            throw new Error(`HTTP ${result.status}：${snippet}`);
        }
    }

    if (source === 'gitee') {
        let json;
        try { json = JSON.parse(text); }
        catch (e) { throw new Error('Gitee 返回内容解析失败：' + e.message); }
        if (!json.content) throw new Error('Gitee 返回内容缺少 content 字段');
        return base64DecodeUnicode(json.content);
    }
    return text;
}

async function fetchVersionJson() {
    const text = await fetchFile('工具箱/version.json');
    return JSON.parse(text);
}

async function fetchChangelog() {
    const text = await fetchFile('工具箱/更新日志.txt');
    let lines = text.split('\n');
    while (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();
    return lines;
}

/* ============================================================
 * 启动器自检
 * ============================================================ */
function getSelfVersion() {
    const m = document.title.match(/^Launcher-(.+)$/);
    return m ? m[1] : null;
}

async function selfCheck() {
    const selfV = getSelfVersion();
    if (!selfV) return;
    let vjson;
    try { vjson = await fetchVersionJson(); }
    catch (e) { console.warn('version.json 拉取失败：', e); return; }
    const latest = vjson.Launcher && vjson.Launcher[0];
    if (!latest) return;
    if (compareVersion(latest, selfV) > 0) {
        try {
            const html = await fetchFile(launcherPath(latest));
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const dlUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = dlUrl;
            a.download = `Launcher-${latest}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(dlUrl), 5000);
            alert(
                `已下载最新版启动器 ${latest}。\n\n` +
                `数据不互通。\n` +
                `使用最新版替换当前版本即可解决。`
            );
        } catch (e) {
            console.warn('启动器新版下载失败：', e);
        }
    }
}

/* ============================================================
 * 本地最新版
 * ============================================================ */
async function getLatestLocalVersion() {
    const allKeys = await idbKeys(STORE_FILES);
    const versions = allKeys
        .filter(k => /^YuYiTool-.+\.html$/.test(k))
        .map(k => k.replace(/^YuYiTool-/, '').replace(/\.html$/, ''));
    if (versions.length === 0) return null;
    versions.sort(compareVersion);
    return versions[versions.length - 1];
}

/* ============================================================
 * 下载工具箱
 * ============================================================ */
async function downloadToolbox(version) {
    const html = await fetchFile(toolboxPath(version));
    const fname = `YuYiTool-${version}.html`;
    await idbSet(STORE_FILES, fname, html);
}

/* ============================================================
 * 自动检查（跨周日）
 * ============================================================ */
async function maybeAutoCheck() {
    const info = await getInfo();
    const now = Date.now();
    let shouldCheck = false;
    if (info.lastCheckTime === 0) {
        shouldCheck = true;
    } else {
        const lastSunday = getLastSundayMidnight(now);
        if (lastSunday > info.lastCheckTime) shouldCheck = true;
    }
    if (!shouldCheck) return;

    await selfCheck();

    try {
        const vjson = await fetchVersionJson();
        const latest = vjson.Toolbox && vjson.Toolbox[0];
        if (latest) {
            const localLatest = await getLatestLocalVersion();
            if (localLatest && compareVersion(latest, localLatest) > 0) {
                let logText = '(无更新日志)';
                try {
                    const logs = await fetchChangelog();
                    if (logs.length > 0) logText = logs[logs.length - 1];
                } catch (e) {}
                const msg = `发现新版本：YuYiTool-${latest}\n\n更新日志：\n${logText}\n\n是否下载？`;
                if (confirm(msg)) {
                    try {
                        await downloadToolbox(latest);
                        alert(`已下载 YuYiTool-${latest}.html`);
                    } catch (e) {
                        alert('下载失败：' + (e.message || '未知错误'));
                    }
                }
            }
        }
    } catch (e) {
        console.warn('检查工具箱失败：', e);
    }

    info.lastCheckTime = Date.now();
    await saveInfo(info);
}

/* ============================================================
 * 渲染工具箱（★ 用 srcdoc，继承父页面 origin）
 * ============================================================ */
let currentVersion = null;

function injectShim(html, baseHref) {
    const shim = `<script>
(function(){
  try {
    var b = document.querySelector('base');
    if (!b) { b = document.createElement('base'); document.head.insertBefore(b, document.head.firstChild); }
    b.href = '${baseHref}';
  } catch(e){}

  function send(type) { try { parent.postMessage({type:type}, '*'); } catch(e) {} }

  try {
    Object.defineProperty(window.location, 'reload', {
      value: function(){ send('tool-reload'); }, configurable: true
    });
  } catch(e) {}

  document.addEventListener('click', function(e){
    var t = e.target.closest('button, a, [role="button"]');
    if (!t) return;
    var txt = (t.textContent || '').trim();
    if (/刷新|重载|reload|refresh/i.test(txt)) {
      e.preventDefault(); e.stopPropagation();
      send('tool-reload');
    }
  }, true);

  document.addEventListener('keydown', function(e){
    if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase() === 'r')) {
      e.preventDefault(); send('tool-reload');
    }
  }, true);
})();
<\/script>`;
    let cleaned = html.replace(/<base\s[^>]*>/i, '');
    if (/<head[^>]*>/i.test(cleaned)) {
        return cleaned.replace(/<head([^>]*)>/i, `<head$1>${shim}`);
    }
    return shim + cleaned;
}

async function renderToolbox(version) {
    const fname = `YuYiTool-${version}.html`;
    const html = await idbGet(STORE_FILES, fname);
    if (!html) {
        console.warn('未找到版本：', fname);
        return false;
    }

    const info = await getInfo();
    const dir = `工具箱/版本/${versionSubDir(version)}/`;
    let baseHref;
    if (info.source === 'gitee') {
        baseHref = `https://gitee.com/${OWNER}/${REPO}/raw/${REF}/${encodePath(dir)}`;
    } else {
        baseHref = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${REF}/${encodePath(dir)}`;
    }

    const injected = injectShim(html, baseHref);
    currentVersion = version;

    const iframe = document.getElementById('toolFrame');
    iframe.srcdoc = injected;

    document.getElementById('view-tool').style.display = 'block';
    document.getElementById('view-list').style.display = 'none';
    return true;
}

/* ============================================================
 * 版本列表
 * ============================================================ */
let selectedVersion = null;

async function renderVersionList() {
    const listEl = document.getElementById('localVersionList');
    listEl.innerHTML = '';
    const allKeys = await idbKeys(STORE_FILES);
    const versions = allKeys
        .filter(k => /^YuYiTool-.+\.html$/.test(k))
        .map(k => k.replace(/^YuYiTool-/, '').replace(/\.html$/, ''))
        .sort(compareVersion)
        .reverse();

    if (versions.length === 0) {
        listEl.innerHTML = '<div>暂无已下载的版本</div>';
        document.getElementById('openBtn').disabled = true;
        return;
    }

    versions.forEach((v, i) => {
        const item = document.createElement('label');
        item.style.display = 'block';
        item.style.padding = '4px 0';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'toolboxVersion';
        radio.value = v;
        radio.checked = (i === 0);
        radio.onchange = () => {
            selectedVersion = v;
            document.getElementById('openBtn').disabled = false;
        };
        item.appendChild(radio);
        item.appendChild(document.createTextNode(' YuYiTool-' + v + '.html'));
        listEl.appendChild(item);
    });
    selectedVersion = versions[0];
    document.getElementById('openBtn').disabled = false;
    document.getElementById('launcherTitle').textContent = document.title;
}

/* ============================================================
 * 检查更新
 * ============================================================ */
let selectedRemoteVersion = null;

async function checkUpdates() {
    const vjson = await fetchVersionJson();
    const versions = vjson.Toolbox || [];
    if (versions.length === 0) {
        alert('未在 version.json 中找到任何工具箱版本');
        return;
    }
    const logs = await fetchChangelog();

    const remoteList = document.getElementById('remoteVersionList');
    const changelogDisplay = document.getElementById('changelogDisplay');
    remoteList.innerHTML = '';
    changelogDisplay.textContent = '';
    selectedRemoteVersion = null;
    document.getElementById('downloadBtn').disabled = true;

    versions.forEach((v, i) => {
        const lineIdx = logs.length - 1 - i;
        const log = (lineIdx >= 0 && lineIdx < logs.length) ? logs[lineIdx] : '(无日志)';
        const item = document.createElement('label');
        item.style.display = 'block';
        item.style.padding = '4px 0';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'remoteVersion';
        radio.value = v;
        radio.onchange = () => {
            selectedRemoteVersion = v;
            changelogDisplay.textContent = log;
            document.getElementById('downloadBtn').disabled = false;
        };
        item.appendChild(radio);
        item.appendChild(document.createTextNode(' YuYiTool-' + v + '.html'));
        remoteList.appendChild(item);
    });

    document.getElementById('remoteSection').style.display = 'block';
}

/* ============================================================
 * 视图切换
 * ============================================================ */
async function showVersionList() {
    document.getElementById('toolFrame').srcdoc = '';
    currentVersion = null;

    document.getElementById('view-tool').style.display = 'none';
    document.getElementById('view-list').style.display = 'block';

    // 回到干净状态
    document.getElementById('remoteSection').style.display = 'none';
    document.getElementById('remoteVersionList').innerHTML = '';
    document.getElementById('changelogDisplay').textContent = '';
    selectedRemoteVersion = null;
    document.getElementById('downloadBtn').disabled = true;

    const checkBtn = document.getElementById('checkBtn');
    checkBtn.disabled = false;
    checkBtn.textContent = '检查更新';

    const info = await getInfo();
    document.querySelectorAll('input[name="source"]').forEach(r => {
        r.checked = (r.value === info.source);
    });

    await renderVersionList();
}

/* ============================================================
 * 事件绑定
 * ============================================================ */
document.getElementById('openBtn').onclick = async () => {
    if (selectedVersion) await renderToolbox(selectedVersion);
};

document.getElementById('checkBtn').onclick = async () => {
    const btn = document.getElementById('checkBtn');
    btn.disabled = true;
    btn.textContent = '检查中...';
    try {
        await selfCheck();
        await checkUpdates();
        const info = await getInfo();
        info.lastCheckTime = Date.now();
        await saveInfo(info);
    } catch (e) {
        console.error(e);
        alert(e.message || '未知错误');
    } finally {
        btn.disabled = false;
        btn.textContent = '检查更新';
    }
};

document.getElementById('downloadBtn').onclick = async () => {
    if (!selectedRemoteVersion) return;
    const btn = document.getElementById('downloadBtn');
    btn.disabled = true;
    btn.textContent = '下载中...';
    try {
        const html = await fetchFile(toolboxPath(selectedRemoteVersion));
        await idbSet(STORE_FILES, `YuYiTool-${selectedRemoteVersion}.html`, html);
        alert(`已下载 YuYiTool-${selectedRemoteVersion}.html`);
        await renderVersionList();
    } catch (e) {
        console.error(e);
        alert(e.message || '未知错误');
    } finally {
        btn.disabled = false;
        btn.textContent = '下载该版本';
    }
};

document.querySelectorAll('input[name="source"]').forEach(r => {
    r.addEventListener('change', async () => {
        if (!r.checked) return;
        const info = await getInfo();
        info.source = r.value;
        await saveInfo(info);
    });
});

window.addEventListener('message', e => {
    const data = e.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'tool-exit') {
        showVersionList();
    } else if (data.type === 'tool-reload') {
        if (currentVersion) renderToolbox(currentVersion);
    }
});

/* ============================================================
 * 启动
 * ============================================================ */
(async function init() {
    // ★ 请求持久化存储（防止 IDB 被浏览器清理）
    try {
        if (navigator.storage && navigator.storage.persist) {
            const granted = await navigator.storage.persist();
            console.log('IDB 持久化:', granted ? '✅ 已授予' : '❌ 被拒绝');
        }
    } catch (e) {
        console.warn('persist 请求失败：', e);
    }

    await maybeAutoCheck();
    await maybeAutoCheck();

    let latest = await getLatestLocalVersion();

    if (!latest) {
        try {
            const vjson = await fetchVersionJson();
            const remoteLatest = vjson.Toolbox && vjson.Toolbox[0];
            if (remoteLatest) {
                const html = await fetchFile(toolboxPath(remoteLatest));
                await idbSet(STORE_FILES, `YuYiTool-${remoteLatest}.html`, html);
                latest = remoteLatest;
            }
        } catch (e) {
            console.error('拉取版本信息失败：', e);
        }
    }

    if (latest) {
        const ok = await renderToolbox(latest);
        if (ok) return;
    }

    await showVersionList();
})();
</script>

</body>
</html>
