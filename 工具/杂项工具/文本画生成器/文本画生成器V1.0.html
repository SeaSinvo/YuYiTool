<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本画生成器</title>
<style>
  :root {
    --gap: 10px;
    --add-size: 44px;
    --border: #e3e9f2;
    --text: #2b3544;
    --muted: #8a94a6;
    --primary: #2f6bff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #eef3ff 0%, #f7f9fc 50%, #eef2f9 100%);
    color: var(--text);
    padding: 32px 20px 60px;
    display: flex;
    justify-content: center;
  }

  .app { width: 100%; max-width: 1440px; }

  /* ---------- 顶部 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar h1::before {
    content: "";
    width: 4px;
    height: 18px;
    border-radius: 2px;
    background: linear-gradient(180deg, #5b9bff, #2f6bff);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .counter {
    font-size: 13px;
    color: var(--muted);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 16px;
    box-shadow: 0 2px 8px rgba(24, 45, 80, .05);
  }
  .counter b { color: var(--primary); font-size: 15px; }

  .btn {
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .2s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .measure-btn {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 12px rgba(16, 185, 129, .3);
  }
  .measure-btn:hover:not(:disabled) { box-shadow: 0 7px 16px rgba(16, 185, 129, .42); }

  /* ---------- 表单区 ---------- */
  .form-area {
    --cols: 5;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--gap);
    padding: 18px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(31, 60, 120, .08);
    min-height: 96px;
  }

  .group {
    display: flex;
    align-items: center;
    gap: 5px;
    width: calc((100% - var(--cols) * var(--gap) - var(--add-size)) / var(--cols) - 1px);
    background: #f8fafd;
    border: 1px solid #e8edf5;
    border-radius: 12px;
    padding: 6px;
    transition: border-color .18s, box-shadow .18s, background .18s, transform .18s;
    animation: pop .2s ease;
  }
  .group:focus-within {
    background: #fff;
    border-color: #b9cdfa;
    box-shadow: 0 0 0 3px rgba(47, 107, 255, .10);
  }
  .group.measuring {
    background: #fff;
    border-color: #5b9bff;
    box-shadow: 0 0 0 4px rgba(91, 155, 255, .18);
    transform: translateY(-2px);
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  .in-cn {
    flex: 1.1 1 0;
    min-width: 0;
    height: 36px;
    line-height: 36px;
    font-size: 15px;
    text-align: center;
    color: var(--text);
    background: #fff;
    border: 1px solid #e2e8f1;
    border-radius: 8px;
    padding: 0 6px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .in-cn::placeholder { color: #b8c2d1; font-size: 13px; }
  .in-cn:focus { border-color: #5b9bff; box-shadow: 0 0 0 3px rgba(91, 155, 255, .15); }
  .in-cn.invalid { border-color: #ff6b6b; background: #fff6f6; box-shadow: 0 0 0 3px rgba(255, 107, 107, .12); }

  .pct-box {
    flex: 0.9 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    height: 36px;
    background: #fff;
    border: 1px solid #e2e8f1;
    border-radius: 8px;
    padding-right: 6px;
    transition: border-color .18s, box-shadow .18s;
  }
  .pct-box:focus-within { border-color: #5b9bff; box-shadow: 0 0 0 3px rgba(91, 155, 255, .15); }
  .pct-box.invalid { border-color: #ff6b6b; background: #fff6f6; box-shadow: 0 0 0 3px rgba(255, 107, 107, .12); }

  .in-pct {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    line-height: 36px;
    font-size: 14px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    padding: 0 2px 0 8px;
  }
  .in-pct::placeholder { color: #b8c2d1; font-size: 13px; }

  .pct-sign { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: #9aa6b8; user-select: none; }

  .del-btn {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #b0bac8;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .del-btn:hover { background: #ffe9e9; color: #ff4d4f; }
  .del-btn:active { transform: scale(.9); }

  .add-btn {
    flex: 0 0 auto;
    width: var(--add-size);
    height: var(--add-size);
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #5b9bff, #2f6bff);
    color: #fff;
    font-size: 24px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(47, 107, 255, .35);
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .add-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(47, 107, 255, .45); }
  .add-btn:active { transform: scale(.94); }

  .empty-tip { margin-top: 14px; text-align: center; font-size: 13px; color: #a8b2c1; }

  /* ---------- 测量面板 ---------- */
  .measure-panel {
    display: none;
    margin-top: 18px;
    align-items: center;
    gap: 24px;
    background: #fff;
    border-radius: 18px;
    padding: 20px 24px;
    box-shadow: 0 10px 30px rgba(31, 60, 120, .08);
    animation: pop .22s ease;
  }
  .measure-panel.show { display: flex; }

  .canvas-wrap {
    position: relative;
    flex: 0 0 auto;
    width: 200px;
    height: 200px;
  }
  #measureCanvas {
    display: block;
    width: 200px;
    height: 200px;
    border-radius: 12px;
    border: 1px solid #e3e9f2;
    background: #fbfcff;
  }
  .canvas-wrap::before, .canvas-wrap::after {
    content: "";
    position: absolute;
    background: rgba(91, 155, 255, .22);
    pointer-events: none;
    border-radius: 1px;
  }
  .canvas-wrap::before { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-0.5px); }
  .canvas-wrap::after { top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-0.5px); }

  .measure-text {
    font-size: 14px;
    color: #5a6678;
    line-height: 1.9;
    word-break: break-word;
  }
  .measure-text b { color: #2f6bff; font-size: 15px; }
  .measure-text .sub { display: block; font-size: 12px; color: #9aa6b8; margin-top: 4px; }

  /* ---------- 通用 section ---------- */
  .section {
    margin-top: 18px;
    background: #fff;
    border-radius: 18px;
    padding: 20px 24px;
    box-shadow: 0 10px 30px rgba(31, 60, 120, .08);
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: #2b3544;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: linear-gradient(180deg, #5b9bff, #2f6bff);
  }
  .ratio-tag {
    font-size: 12px;
    color: #2f6bff;
    background: #eef3ff;
    border-radius: 999px;
    padding: 3px 10px;
    font-weight: 600;
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .pixel-tag {
    font-size: 12px;
    color: #ea580c;
    background: #fff3e6;
    border-radius: 999px;
    padding: 3px 10px;
    font-weight: 600;
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 上传 ---------- */
  .upload-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .file-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    background: linear-gradient(135deg, #5b9bff, #2f6bff);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(47, 107, 255, .3);
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .file-label:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(47, 107, 255, .42); }
  .file-label input { display: none; }
  .file-name { font-size: 13px; color: var(--muted); }
  .file-hint { font-size: 12px; color: #a8b2c1; }

  /* ---------- 预览：容器可滚动，画布像素级渲染 ---------- */
  .preview-wrap {
    margin-top: 14px;
    padding: 14px;
    background: #f8fafd;
    border: 1px dashed #d8e0ea;
    border-radius: 12px;
    min-height: 120px;
    text-align: center;
    overflow: auto;
    line-height: 0;
  }
  #previewCanvas {
    display: inline-block;
    vertical-align: middle;
    background: #fff;
    /* 关键 1：CSS 层面禁用平滑，放大时每个像素变成清晰的方块 */
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    box-shadow: 0 0 0 1px #e3e9f2;
    line-height: normal;
  }
  .preview-empty {
    color: #a8b2c1;
    font-size: 13px;
    line-height: 1.6;
    display: inline-block;
    vertical-align: middle;
  }

  /* ---------- 尺寸 ---------- */
  .size-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .size-field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #5a6678;
  }
  .size-field input[type="text"] {
    width: 84px;
    height: 36px;
    padding: 0 10px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    border: 1px solid #e2e8f1;
    border-radius: 8px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .size-field input[type="text"]:focus {
    border-color: #5b9bff; box-shadow: 0 0 0 3px rgba(91, 155, 255, .15);
  }
  .size-field input[type="text"].invalid { border-color: #ff6b6b; background: #fff6f6; }

  .lock-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #5a6678;
    cursor: pointer;
    user-select: none;
  }
  .lock-label input { width: 16px; height: 16px; accent-color: #2f6bff; cursor: pointer; }

  .generate-btn {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    box-shadow: 0 4px 12px rgba(234, 88, 12, .3);
  }
  .generate-btn:hover:not(:disabled) { box-shadow: 0 7px 16px rgba(234, 88, 12, .42); }

  /* ---------- 进度 ---------- */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .progress-text {
    font-size: 13px;
    color: #5a6678;
    font-variant-numeric: tabular-nums;
    min-width: 220px;
  }
  .progress-bar-wrap {
    flex: 1 1 200px;
    height: 10px;
    background: #eef2f8;
    border-radius: 999px;
    overflow: hidden;
    min-width: 160px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #5b9bff, #2f6bff);
    border-radius: 999px;
    transition: width .1s linear;
  }

  /* ---------- 输出工具条 ---------- */
  .output-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tool-btn {
    border: 1px solid #e2e8f1;
    background: #fff;
    color: #5a6678;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .tool-btn:hover { background: #eef3ff; border-color: #b9cdfa; color: #2f6bff; }
  .tool-btn:active { transform: scale(.96); }
  .tool-btn.primary {
    background: linear-gradient(135deg, #5b9bff, #2f6bff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(47, 107, 255, .3);
  }
  .tool-btn.primary:hover { box-shadow: 0 7px 16px rgba(47, 107, 255, .42); color: #fff; }
  .tool-btn.copied {
    background: linear-gradient(135deg, #34d399, #10b981);
    border-color: transparent;
    color: #fff;
  }
  .font-size-label {
    font-size: 12px;
    color: #9aa6b8;
    font-variant-numeric: tabular-nums;
    min-width: 48px;
    text-align: center;
  }

  /* ---------- 输出 ---------- */
  .output-shell {
    width: 100%;
    height: 70vh;
    min-height: 320px;
    background: #fbfcff;
    border: 1px solid #e2e8f1;
    border-radius: 12px;
    overflow: auto;
    transition: border-color .18s, box-shadow .18s;
  }
  .output-shell:focus-within {
    border-color: #5b9bff;
    box-shadow: 0 0 0 3px rgba(91, 155, 255, .15);
    background: #fff;
  }

  #outputArea {
    display: block;
    margin: 0;
    padding: 14px;
    min-width: 100%;
    min-height: 100%;
    box-sizing: border-box;
    font-family: "SimSun", "宋体", "NSimSun", "新宋体", "Microsoft YaHei", serif;
    font-size: 14px;
    line-height: 1;
    letter-spacing: 0;
    word-spacing: 0;
    color: #1f2a3a;
    background: transparent;
    white-space: pre;
    tab-size: 1;
    word-break: normal;
    overflow-wrap: normal;
    outline: none;
    border: none;
    text-rendering: geometricPrecision;
    font-variant-east-asian: normal;
  }
  #outputArea:empty::before {
    content: attr(data-placeholder);
    color: #b8c2d1;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1200px) { .form-area { --cols: 4; } }
  @media (max-width: 920px)  { .form-area { --cols: 3; } }
  @media (max-width: 680px)  { .form-area { --cols: 2; } }
  @media (max-width: 420px)  { .form-area { --cols: 1; --add-size: 40px; } }

  @media (max-width: 520px) {
    .measure-panel { flex-direction: column; align-items: flex-start; }
    .canvas-wrap, #measureCanvas { width: 160px; height: 160px; }
    .output-shell { height: 55vh; min-height: 260px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 顶部 -->
  <div class="topbar">
    <h1>文本画生成器</h1>
    <div class="topbar-right">
      <button class="btn measure-btn" id="measureBtn" type="button">自动测量占用百分比</button>
      <div class="counter">已添加 <b id="count">0</b> / 10 组</div>
    </div>
  </div>

  <!-- 组列表 -->
  <div class="form-area" id="formArea">
    <button class="add-btn" id="addBtn" type="button" aria-label="添加一组输入框">+</button>
  </div>
  <div class="empty-tip" id="emptyTip">还没有输入框，点「+」添加一组（最多 10 组）；在输入框里按 Enter 也能快速添加下一组</div>

  <!-- 测量面板 -->
  <div class="measure-panel" id="measurePanel">
    <div class="canvas-wrap">
      <canvas id="measureCanvas" width="240" height="240"></canvas>
    </div>
    <div class="measure-text" id="measureText">
      点击「自动测量占用百分比」开始逐字测量。
      <span class="sub">
        字号 = 画布尺寸，墨迹按几何中心垂直居中；空白组会合并为一个并填入双空格（测量为 0%）。测量完成后本面板会自动关闭。
      </span>
    </div>
  </div>

  <!-- 图片上传 -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">图片上传（PNG / JPG）</div>
    </div>
    <div class="upload-row">
      <label class="file-label">
        <input type="file" id="fileInput" accept="image/png, image/jpeg">
        选择图片
      </label>
      <span class="file-name" id="fileName">未选择文件</span>
      <span class="file-hint">上传前请确保所有百分比都已填写</span>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <span class="preview-empty">上传后这里会显示像素级灰度预览</span>
      <canvas id="previewCanvas" style="display:none;"></canvas>
    </div>
  </div>

  <!-- 尺寸设置 -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">
        尺寸设置
        <span class="ratio-tag" id="ratioTag">— : —</span>
        <span class="pixel-tag" id="previewScaleTag" style="display:none;">—×</span>
      </div>
    </div>
    <div class="size-row">
      <label class="size-field">宽 <input type="text" id="widthInput" inputmode="numeric" value="0"> px</label>
      <label class="size-field">高 <input type="text" id="heightInput" inputmode="numeric" value="0"> px</label>
      <label class="lock-label"><input type="checkbox" id="lockRatio" checked> 锁定长宽比</label>
      <button class="btn generate-btn" id="generateBtn" type="button">开始生成</button>
    </div>
  </div>

  <!-- 进度 -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">处理进度</div>
    </div>
    <div class="progress-row">
      <div class="progress-text" id="progressText">等待开始</div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>

  <!-- 输出 -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">
        输出结果
        <span class="ratio-tag" id="outputRatioTag" style="display:none;">— : —</span>
      </div>
      <div class="output-tools">
        <button class="tool-btn" id="fitBtn" type="button" title="自动缩放字号，让输出完整显示">适应</button>
        <button class="tool-btn" id="fontSmallerBtn" type="button" title="缩小字号">A−</button>
        <span class="font-size-label" id="fontSizeLabel">14px</span>
        <button class="tool-btn" id="fontLargerBtn" type="button" title="放大字号">A+</button>
        <button class="tool-btn" id="fontResetBtn" type="button" title="重置字号">重置</button>
        <button class="tool-btn primary" id="copyBtn" type="button" title="复制全部输出内容">一键复制</button>
      </div>
    </div>
    <div class="output-shell" id="outputShell">
      <pre id="outputArea" data-placeholder="生成结果会实时显示在这里……"></pre>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 常量 ==================== */
  var MAX = 10;
  var HANZI_RE  = /[\u3400-\u4dbf\u4e00-\u9fa5]/g;
  var HANZI_ONE = /^[\u3400-\u4dbf\u4e00-\u9fa5]$/;
  var BLANK = '  ';
  var CANVAS_SIZE = 240;
  var FONT_STACK  = '"PingFang SC", "Microsoft YaHei", "Heiti SC", "SimHei", "Noto Sans SC", sans-serif';
  var CHUNK_PER_FRAME = 500;
  var REFRESH_EVERY = 50;
  var MAX_PIXELS = 4000000;

  var DEFAULT_FONT_SIZE = 14;
  var MIN_FONT_SIZE = 1;
  var MAX_FONT_SIZE = 72;
  var FONT_STEP = 1;
  var BASE_FONT_SIZE = 12;
  var currentFontSize = DEFAULT_FONT_SIZE;

  /* 预览显示参数 */
  var PREVIEW_MAX_H = 600;      // 预览最高像素高
  var PREVIEW_MAX_SCALE = 16;   // 最大放大倍数
  var PREVIEW_PAD = 28;         // .preview-wrap 内边距（14 * 2）

  /* ==================== DOM ==================== */
  var formArea      = document.getElementById('formArea');
  var addBtn        = document.getElementById('addBtn');
  var countEl       = document.getElementById('count');
  var emptyTip      = document.getElementById('emptyTip');
  var measureBtn    = document.getElementById('measureBtn');
  var measurePanel  = document.getElementById('measurePanel');
  var measureText   = document.getElementById('measureText');
  var measureCanvas = document.getElementById('measureCanvas');

  var fileInput     = document.getElementById('fileInput');
  var fileName      = document.getElementById('fileName');
  var previewWrap   = document.getElementById('previewWrap');
  var previewCanvas = document.getElementById('previewCanvas');

  var widthInput    = document.getElementById('widthInput');
  var heightInput   = document.getElementById('heightInput');
  var lockRatio     = document.getElementById('lockRatio');
  var generateBtn   = document.getElementById('generateBtn');
  var ratioTag      = document.getElementById('ratioTag');
  var previewScaleTag = document.getElementById('previewScaleTag');
  var outputRatioTag = document.getElementById('outputRatioTag');

  var progressText  = document.getElementById('progressText');
  var progressBar   = document.getElementById('progressBar');
  var outputShell   = document.getElementById('outputShell');
  var outputArea    = document.getElementById('outputArea');

  var fitBtn         = document.getElementById('fitBtn');
  var fontSmallerBtn = document.getElementById('fontSmallerBtn');
  var fontLargerBtn  = document.getElementById('fontLargerBtn');
  var fontResetBtn   = document.getElementById('fontResetBtn');
  var fontSizeLabel  = document.getElementById('fontSizeLabel');
  var copyBtn        = document.getElementById('copyBtn');

  /* ==================== 状态 ==================== */
  var sourceImage = null;
  var aspectRatio = 1;
  var mCtx = null;
  var generating = false;
  var lastTW = 0, lastTH = 0;

  /* ==================== 基础工具 ==================== */

  function groups() { return formArea.querySelectorAll('.group'); }

  function updateUI() {
    var n = groups().length;
    countEl.textContent = n;
    addBtn.style.display = (n >= MAX) ? 'none' : 'flex';
    emptyTip.style.display = (n === 0) ? 'block' : 'none';
  }

  function createGroup() {
    var div = document.createElement('div');
    div.className = 'group';
    div.innerHTML =
      '<input class="in-cn" type="text" placeholder="汉字（可留空）" autocomplete="off" spellcheck="false">' +
      '<div class="pct-box">' +
        '<input class="in-pct" type="text" inputmode="decimal" placeholder="0-100" autocomplete="off" spellcheck="false">' +
        '<span class="pct-sign">%</span>' +
      '</div>' +
      '<button class="del-btn" type="button" title="删除这一组" aria-label="删除这一组">×</button>';
    return div;
  }

  function appendGroup(focusFirst) {
    if (groups().length >= MAX) return null;
    var g = createGroup();
    formArea.insertBefore(g, addBtn);
    updateUI();
    if (focusFirst !== false) {
      var cn = g.querySelector('.in-cn');
      if (cn) cn.focus();
    }
    return g;
  }

  function cleanHanzi(v) {
    var m = String(v).match(HANZI_RE);
    return m ? m[0] : '';
  }

  function cleanPct(v) {
    var s = String(v).replace(/[^\d.]/g, '');
    var i = s.indexOf('.');
    if (i !== -1) {
      s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, '').slice(0, 2);
    }
    if (/^0\d/.test(s)) {
      s = s.replace(/^0+/, '');
      if (s === '' || s.charAt(0) === '.') s = '0' + s;
    }
    if (s !== '' && s !== '.') {
      var n = parseFloat(s);
      if (isNaN(n)) s = '';
      else if (n > 100) s = '100';
    }
    return s;
  }

  function isCnValid(v) {
    return v === '' || v === BLANK || HANZI_ONE.test(v);
  }

  function markInvalid(el, bad) {
    if (bad) {
      el.classList.add('invalid');
      var box = el.closest('.pct-box');
      if (box) box.classList.add('invalid');
    } else {
      clearInvalid(el);
    }
  }
  function clearInvalid(el) {
    el.classList.remove('invalid');
    var box = el.closest('.pct-box');
    if (box) box.classList.remove('invalid');
  }

  function formatPct(n) {
    var s = n.toFixed(2).replace(/\.?0+$/, '');
    return s === '' ? '0' : s;
  }

  function formatRatio(w, h) {
    if (!w || !h) return '— : —';
    var a = w, b = h;
    while (b) { var t = b; b = a % b; a = t; }
    var g = a || 1;
    var rw = Math.round(w / g), rh = Math.round(h / g);
    if (rw > 99 || rh > 99) {
      return (w / h).toFixed(2) + ' : 1';
    }
    return rw + ' : ' + rh;
  }

  function updateRatioTag() {
    var w = getDimension(widthInput);
    var h = getDimension(heightInput);
    if (w && h) ratioTag.textContent = formatRatio(w, h);
    else ratioTag.textContent = '— : —';
  }

  /* ==================== 输入过滤 ==================== */

  formArea.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.classList) return;

    if (t.classList.contains('in-cn')) {
      if (e.isComposing || t.dataset.composing === '1') return;
      var c = cleanHanzi(t.value);
      if (c !== t.value) t.value = c;
      clearInvalid(t);
      return;
    }
    if (t.classList.contains('in-pct')) {
      var p = cleanPct(t.value);
      if (p !== t.value) t.value = p;
      clearInvalid(t);
      return;
    }
  });

  formArea.addEventListener('compositionstart', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('in-cn')) t.dataset.composing = '1';
  });
  formArea.addEventListener('compositionend', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('in-cn')) {
      t.dataset.composing = '0';
      var c = cleanHanzi(t.value);
      if (c !== t.value) t.value = c;
      clearInvalid(t);
    }
  });

  formArea.addEventListener('blur', function (e) {
    var t = e.target;
    if (!t.classList) return;

    if (t.classList.contains('in-cn')) {
      markInvalid(t, !isCnValid(t.value));
      return;
    }
    if (t.classList.contains('in-pct')) {
      var v = t.value.trim();
      if (v !== '' && v !== '.') {
        var n = parseFloat(v);
        if (!isNaN(n)) {
          if (n > 100) n = 100;
          if (n < 0) n = 0;
          t.value = String(n);
        }
      }
      var val = t.value.trim();
      var valid = val !== '' && !isNaN(parseFloat(val));
      markInvalid(t, !valid);
      return;
    }
  }, true);

  /* ==================== Enter 快捷键 ==================== */

  formArea.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;

    var t = e.target;
    if (!t.classList) return;
    if (!t.classList.contains('in-cn') && !t.classList.contains('in-pct')) return;

    if (e.isComposing || t.dataset.composing === '1') return;
    if (e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
    if (groups().length >= MAX) return;

    e.preventDefault();
    appendGroup(true);
  });

  /* ==================== 删除 / 添加 ==================== */

  formArea.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.del-btn') : null;
    if (!btn) return;
    var g = btn.closest('.group');
    if (g) { g.remove(); updateUI(); }
  });

  addBtn.addEventListener('click', function () {
    appendGroup(true);
  });

  /* ==================== 画布测量 ==================== */

  function getMCtx() {
    if (!mCtx) mCtx = measureCanvas.getContext('2d', { willReadFrequently: true });
    return mCtx;
  }

  function drawChar(ch) {
    var ctx = getMCtx();
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    if (!ch || ch === BLANK || ch.trim() === '') return;

    ctx.font = CANVAS_SIZE + 'px ' + FONT_STACK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#1f2a3a';

    var metrics = ctx.measureText(ch);
    var ascent  = (typeof metrics.actualBoundingBoxAscent === 'number')
                  ? metrics.actualBoundingBoxAscent : CANVAS_SIZE * 0.88;
    var descent = (typeof metrics.actualBoundingBoxDescent === 'number')
                  ? metrics.actualBoundingBoxDescent : CANVAS_SIZE * 0.12;
    var baselineY = CANVAS_SIZE / 2 + (ascent - descent) / 2;
    ctx.fillText(ch, CANVAS_SIZE / 2, baselineY);
  }

  function measureChar(ch) {
    drawChar(ch);
    var ctx = getMCtx();
    var img = ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    var data = img.data;
    var ink = 0;
    for (var i = 3; i < data.length; i += 4) ink += data[i] / 255;
    return (ink / (CANVAS_SIZE * CANVAS_SIZE)) * 100;
  }

  var measuring = false;

  function autoMeasure() {
    if (measuring || generating) return;
    var gs = groups();
    if (gs.length === 0) {
      measurePanel.classList.add('show');
      measureText.innerHTML = '还没有输入框，请先点「+」添加。';
      return;
    }

    var emptyGroups = [];
    for (var a = 0; a < gs.length; a++) {
      var cnA = gs[a].querySelector('.in-cn');
      if (cnA.value !== BLANK && cnA.value.trim() === '') emptyGroups.push(gs[a]);
    }
    if (emptyGroups.length > 1) {
      for (var b = 1; b < emptyGroups.length; b++) emptyGroups[b].remove();
    }
    if (emptyGroups.length > 0) {
      var cnKeep = emptyGroups[0].querySelector('.in-cn');
      if (cnKeep) cnKeep.value = BLANK;
    }

    gs = groups();
    updateUI();

    measuring = true;
    measureBtn.disabled = true;
    measurePanel.classList.add('show');

    var i = 0;

    function finish() {
      measuring = false;
      measureBtn.disabled = false;
      setTimeout(function () { measurePanel.classList.remove('show'); }, 900);
    }

    function step() {
      if (i >= gs.length) { finish(); return; }
      var g = gs[i];
      var cnInput = g.querySelector('.in-cn');
      var pctInput = g.querySelector('.in-pct');
      var raw = cnInput.value;

      g.classList.add('measuring');

      if (raw === BLANK) {
        pctInput.value = '0';
        clearInvalid(pctInput);
        drawChar('');
        measureText.innerHTML = '第 <b>' + (i + 1) + '</b> 组：空白（双空格占位），已设为 <b>0%</b>。';
        setTimeout(function () { g.classList.remove('measuring'); i++; step(); }, 180);
        return;
      }

      var ch = raw.trim();
      if (!ch || !HANZI_ONE.test(ch)) {
        pctInput.value = '';
        drawChar('');
        measureText.innerHTML = '第 <b>' + (i + 1) + '</b> 组：未填写有效汉字，已跳过。';
        setTimeout(function () { g.classList.remove('measuring'); i++; step(); }, 160);
        return;
      }

      var ratio = measureChar(ch);
      pctInput.value = formatPct(ratio);
      clearInvalid(pctInput);
      measureText.innerHTML =
        '第 <b>' + (i + 1) + '</b> 组：汉字 <b>' + ch + '</b> 占画布 <b>' + ratio.toFixed(2) + '%</b>，已填入。';

      setTimeout(function () { g.classList.remove('measuring'); i++; step(); }, 200);
    }
    step();
  }

  measureBtn.addEventListener('click', autoMeasure);

  /* ==================== 图片上传 ==================== */

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!/^image\/(png|jpeg)$/.test(file.type)) {
      alert('只支持 PNG 或 JPG 图片。');
      fileInput.value = '';
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      alert('图片过大（超过 20MB），请压缩后重试。');
      fileInput.value = '';
      return;
    }

    fileName.textContent = file.name;

    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      sourceImage = img;
      aspectRatio = img.naturalWidth / img.naturalHeight;

      widthInput.value = img.naturalWidth;
      heightInput.value = img.naturalHeight;
      updateRatioTag();

      renderPreview();
      URL.revokeObjectURL(url);
    };
    img.onerror = function () {
      alert('图片加载失败，请重试。');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  /* ==================== 预览渲染（像素级） ==================== */

  function getDimension(el) {
    var v = parseInt(el.value, 10);
    if (isNaN(v) || v <= 0) return 0;
    return v;
  }

  /* 关键：所有平滑开关关掉，让采样走最近邻 */
  function disableSmoothing(ctx) {
    ctx.imageSmoothingEnabled = false;
    if ('mozImageSmoothingEnabled' in ctx) ctx.mozImageSmoothingEnabled = false;
    if ('webkitImageSmoothingEnabled' in ctx) ctx.webkitImageSmoothingEnabled = false;
    if ('msImageSmoothingEnabled' in ctx) ctx.msImageSmoothingEnabled = false;
  }

  function renderPreview() {
    if (!sourceImage) return;

    var tw = getDimension(widthInput);
    var th = getDimension(heightInput);
    if (tw === 0 || th === 0) return;
    if (tw * th > MAX_PIXELS) return;

    previewCanvas.style.display = 'inline-block';
    var empty = previewWrap.querySelector('.preview-empty');
    if (empty) empty.style.display = 'none';

    // 画布内部尺寸 = 目标尺寸，1 像素 = 1 数据点
    previewCanvas.width = tw;
    previewCanvas.height = th;

    var ctx = previewCanvas.getContext('2d', { willReadFrequently: true });

    // 关掉平滑 → 采样走最近邻，得到真实的低分辨率像素
    disableSmoothing(ctx);

    // 灰度滤镜在绘制时生效
    ctx.filter = 'grayscale(100%)';

    var sw = sourceImage.naturalWidth;
    var sh = sourceImage.naturalHeight;
    var scale = Math.max(tw / sw, th / sh);
    var dw = sw * scale;
    var dh = sh * scale;
    var dx = (tw - dw) / 2;
    var dy = (th - dh) / 2;

    ctx.clearRect(0, 0, tw, th);
    ctx.drawImage(sourceImage, dx, dy, dw, dh);
    ctx.filter = 'none';

    // 计算并应用显示尺寸（整数倍放大，像素清晰）
    updatePreviewDisplay(tw, th);
  }

  /* 计算显示尺寸：整数倍缩放，让每个像素变成清晰的方块 */
  function updatePreviewDisplay(tw, th) {
    var wrapW = previewWrap.clientWidth;
    var maxW = (wrapW > 0 ? wrapW : 1000) - PREVIEW_PAD;
    var maxH = PREVIEW_MAX_H;

    var fitScale = Math.min(maxW / tw, maxH / th);
    var scale;

    if (fitScale >= 1) {
      // 1:1 或放大：用整数倍，保证像素边界整齐
      scale = Math.floor(fitScale);
      if (scale > PREVIEW_MAX_SCALE) scale = PREVIEW_MAX_SCALE;
      if (scale < 1) scale = 1;
    } else {
      // 目标尺寸超出容器，只能用小数倍
      scale = fitScale;
    }

    previewCanvas.style.width = Math.round(tw * scale) + 'px';
    previewCanvas.style.height = Math.round(th * scale) + 'px';

    // 显示当前缩放比
    var scaleText;
    if (scale >= 1) {
      scaleText = scale + '×';
    } else {
      scaleText = (scale * 100).toFixed(0) + '%';
    }
    if (previewScaleTag) {
      previewScaleTag.style.display = 'inline-block';
      previewScaleTag.textContent = scaleText + ' · ' + tw + '×' + th;
    }
  }

  /* 窗口尺寸变化时重新计算显示尺寸 */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (!sourceImage) return;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var tw = getDimension(widthInput);
      var th = getDimension(heightInput);
      if (tw && th) updatePreviewDisplay(tw, th);
    }, 100);
  });

  /* ==================== 尺寸联动 ==================== */

  function sanitizeIntInput(el) {
    var s = String(el.value).replace(/[^\d]/g, '');
    if (s !== el.value) el.value = s;
    return s;
  }

  function applyRatioFromWidth() {
    if (!lockRatio.checked || !sourceImage) return;
    var w = getDimension(widthInput);
    if (w <= 0) return;
    var h = Math.round(w / aspectRatio);
    if (h > 0) heightInput.value = h;
  }
  function applyRatioFromHeight() {
    if (!lockRatio.checked || !sourceImage) return;
    var h = getDimension(heightInput);
    if (h <= 0) return;
    var w = Math.round(h * aspectRatio);
    if (w > 0) widthInput.value = w;
  }

  var previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { renderPreview(); updateRatioTag(); }, 60);
  }

  widthInput.addEventListener('input', function () {
    sanitizeIntInput(widthInput);
    applyRatioFromWidth();
    schedulePreview();
  });
  heightInput.addEventListener('input', function () {
    sanitizeIntInput(heightInput);
    applyRatioFromHeight();
    schedulePreview();
  });
  widthInput.addEventListener('blur', function () {
    sanitizeIntInput(widthInput);
    applyRatioFromWidth();
    updateRatioTag();
    renderPreview();
  });
  heightInput.addEventListener('blur', function () {
    sanitizeIntInput(heightInput);
    applyRatioFromHeight();
    updateRatioTag();
    renderPreview();
  });

  lockRatio.addEventListener('change', function () {
    if (lockRatio.checked && sourceImage) {
      applyRatioFromWidth();
      updateRatioTag();
      renderPreview();
    }
  });

  /* ==================== 字号调节 ==================== */

  function applyFontSize(size) {
    currentFontSize = Math.min(MAX_FONT_SIZE, Math.max(MIN_FONT_SIZE, size));
    fontSizeLabel.textContent = currentFontSize + 'px';

    if (currentFontSize >= BASE_FONT_SIZE) {
      outputArea.style.fontSize = currentFontSize + 'px';
      outputArea.style.zoom = '';
    } else {
      outputArea.style.fontSize = BASE_FONT_SIZE + 'px';
      outputArea.style.zoom = (currentFontSize / BASE_FONT_SIZE);
    }
  }

  fontSmallerBtn.addEventListener('click', function () {
    applyFontSize(currentFontSize - FONT_STEP);
  });
  fontLargerBtn.addEventListener('click', function () {
    applyFontSize(currentFontSize + FONT_STEP);
  });
  fontResetBtn.addEventListener('click', function () {
    applyFontSize(DEFAULT_FONT_SIZE);
  });

  fitBtn.addEventListener('click', function () {
    if (!lastTW || !lastTH) {
      alert('请先点击「开始生成」得到输出内容。');
      return;
    }
    var cw = outputShell.clientWidth - 32;
    var ch = outputShell.clientHeight - 32;
    if (cw <= 0 || ch <= 0) return;

    var sizeW = cw / lastTW;
    var sizeH = ch / lastTH;
    var size = Math.floor(Math.min(sizeW, sizeH));
    applyFontSize(size);
  });

  applyFontSize(DEFAULT_FONT_SIZE);

  /* ==================== 一键复制 ==================== */

  var copyResetTimer = null;

  function showCopied() {
    copyBtn.textContent = '已复制 ✓';
    copyBtn.classList.add('copied');
    if (copyResetTimer) clearTimeout(copyResetTimer);
    copyResetTimer = setTimeout(function () {
      copyBtn.textContent = '一键复制';
      copyBtn.classList.remove('copied');
    }, 1400);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  copyBtn.addEventListener('click', function () {
    var text = outputArea.textContent || '';
    if (!text) {
      var old = copyBtn.textContent;
      copyBtn.textContent = '内容为空';
      setTimeout(function () { copyBtn.textContent = old; }, 1200);
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, function () {
        if (fallbackCopy(text)) showCopied();
        else alert('复制失败，请手动选择文本复制。');
      });
    } else {
      if (fallbackCopy(text)) showCopied();
      else alert('复制失败，请手动选择文本复制。');
    }
  });

  /* ==================== 收集有效组 + 内部归一化 ==================== */

  function gatherValidGroups() {
    var gs = groups();
    var list = [];
    for (var i = 0; i < gs.length; i++) {
      var cnInput = gs[i].querySelector('.in-cn');
      var pctInput = gs[i].querySelector('.in-pct');
      var pctRaw = (pctInput.value || '').trim();

      if (pctRaw === '') {
        return { error: '第 ' + (i + 1) + ' 组的百分比未填写，请补全后再试。', input: pctInput };
      }
      var pctNum = parseFloat(pctRaw);
      if (isNaN(pctNum) || pctNum < 0 || pctNum > 100) {
        return { error: '第 ' + (i + 1) + ' 组的百分比非法，请填写 0~100 的数字。', input: pctInput };
      }

      var cnVal = cnInput.value;
      var ch;
      if (cnVal === BLANK) ch = BLANK;
      else if (cnVal === '' || cnVal.trim() === '') ch = BLANK;
      else if (HANZI_ONE.test(cnVal)) ch = cnVal;
      else return { error: '第 ' + (i + 1) + ' 组的汉字不合法，请填写单个汉字或留空。', input: cnInput };

      list.push({ char: ch, pct: pctNum });
    }

    if (list.length >= 2) {
      var min = Infinity, max = -Infinity;
      for (var a = 0; a < list.length; a++) {
        if (list[a].pct < min) min = list[a].pct;
        if (list[a].pct > max) max = list[a].pct;
      }
      if (max > min) {
        for (var b = 0; b < list.length; b++) {
          list[b].matchPct = (list[b].pct - min) / (max - min) * 100;
        }
      } else {
        for (var c = 0; c < list.length; c++) list[c].matchPct = list[c].pct;
      }
    } else {
      for (var d = 0; d < list.length; d++) list[d].matchPct = list[d].pct;
    }

    return { list: list };
  }

  /* ==================== 开始生成 ==================== */

  function startGenerate() {
    if (generating || measuring) return;

    if (!sourceImage) {
      alert('请先上传图片。');
      return;
    }

    var gathered = gatherValidGroups();
    if (gathered.error) {
      alert(gathered.error);
      if (gathered.input) gathered.input.focus();
      return;
    }
    var validGroups = gathered.list;
    if (validGroups.length === 0) {
      alert('没有可用的组。');
      return;
    }

    var tw = getDimension(widthInput);
    var th = getDimension(heightInput);
    if (tw <= 0 || th <= 0) {
      alert('宽或高不合法，请填写正整数。');
      return;
    }
    if (tw * th > MAX_PIXELS) {
      alert('目标尺寸过大（超过 ' + MAX_PIXELS + ' 像素），请调小。');
      return;
    }

    lastTW = tw;
    lastTH = th;

    renderPreview();

    var pctx = previewCanvas.getContext('2d', { willReadFrequently: true });
    var imageData;
    try {
      imageData = pctx.getImageData(0, 0, tw, th);
    } catch (err) {
      alert('无法读取画布像素：' + err.message);
      return;
    }
    var pixels = imageData.data;

    var total = tw * th;
    var processed = 0;
    var x = 0, y = 0;
    var buffer = [];

    generating = true;
    generateBtn.disabled = true;
    outputArea.textContent = '';
    outputRatioTag.style.display = 'inline-block';
    outputRatioTag.textContent = formatRatio(tw, th) + ' · ' + tw + '×' + th;
    progressText.textContent = '遍历中……[0/' + total + ']0%';
    progressBar.style.width = '0%';

    function flushToOutput(seg) {
      outputArea.textContent += seg;
    }

    function processChunk() {
      var chunkCount = 0;
      while (processed < total && chunkCount < CHUNK_PER_FRAME) {
        var idx = (y * tw + x) * 4;
        var gray = pixels[idx];
        var darkness = (255 - gray) / 255 * 100;

        var bestChar = BLANK;
        var bestDiff = Infinity;
        for (var k = 0; k < validGroups.length; k++) {
          var d = Math.abs(darkness - validGroups[k].matchPct);
          if (d < bestDiff) { bestDiff = d; bestChar = validGroups[k].char; }
        }

        buffer.push(bestChar);
        processed++;

        x++;
        if (x >= tw) {
          x = 0; y++;
          buffer.push('\n');
        }

        if (processed % REFRESH_EVERY === 0) {
          var seg = buffer.join('');
          buffer.length = 0;
          flushToOutput(seg);
          var pct = Math.floor(processed / total * 100);
          progressText.textContent = '遍历中……[' + processed + '/' + total + ']' + pct + '%';
          progressBar.style.width = pct + '%';
        }
        chunkCount++;
      }

      if (processed < total) {
        requestAnimationFrame(processChunk);
      } else {
        if (buffer.length > 0) flushToOutput(buffer.join(''));
        progressText.textContent = '遍历完成 [' + total + '/' + total + ']100%';
        progressBar.style.width = '100%';
        generating = false;
        generateBtn.disabled = false;
        fitBtn.click();
      }
    }

    requestAnimationFrame(processChunk);
  }

  generateBtn.addEventListener('click', startGenerate);

  /* ==================== 启动 ==================== */

  updateUI();
  updateRatioTag();

})();
</script>

</body>
